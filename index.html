<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>יום האהבה 💖</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="hearts-bg" aria-hidden="true">
    <span class="heart heart-1">♥</span>
    <span class="heart heart-2">♥</span>
    <span class="heart heart-3">♥</span>
    <span class="heart heart-4">♥</span>
    <span class="heart heart-5">♥</span>
    <span class="heart heart-6">♥</span>
    <span class="heart heart-7">♥</span>
    <span class="heart heart-8">♥</span>
    <span class="heart heart-9">♥</span>
    <span class="heart heart-10">♥</span>
    <span class="heart heart-11">♥</span>
    <span class="heart heart-12">♥</span>
    <span class="heart heart-13">♥</span>
    <span class="heart heart-14">♥</span>
    <span class="heart heart-15">♥</span>
    <span class="heart heart-16">♥</span>
    <span class="heart heart-17">♥</span>
    <span class="heart heart-18">♥</span>
    <span class="heart heart-19">♥</span>
    <span class="heart heart-20">♥</span>
    <span class="heart heart-21">♥</span>
    <span class="heart heart-22">♥</span>
    <span class="heart heart-23">♥</span>
    <span class="heart heart-24">♥</span>
    <span class="heart heart-25">♥</span>
    <span class="heart heart-26">♥</span>
    <span class="heart heart-27">♥</span>
    <span class="heart heart-28">♥</span>
    <span class="heart heart-29">♥</span>
    <span class="heart heart-30">♥</span>
  </div>

  <main class="card">
    <div class="heart-top">💖</div>
    <h1 class="question">דור, רוצה להיות הדייט שלי ליום האהבה? 💖</h1>
    <p class="subtitle">תחשוב טוב לפני שאתה עונה 😉</p>
    <p class="date">💖 14.2.2026</p>

    <div class="photos-row">
      <div class="photo-wrap">
        <img src="assets/photo1.jpg" alt="" class="card-photo">
      </div>
      <div class="photo-wrap">
        <img src="assets/photo2.jpg" alt="" class="card-photo">
      </div>
    </div>

    <div class="card-content" id="questionView">
      <div class="buttons-area">
        <div class="btn-yes-wrap">
          <button type="button" class="btn btn-yes" id="btnYes">✨ כן! ✨</button>
        </div>
        <button type="button" class="btn btn-no" id="btnNo">לא</button>
      </div>
    </div>

    <div class="card-content hidden" id="successView">
      <p class="success-message">יאאא דור 😍 ידעתי שתגיד כן!</p>
      <p class="signature">אוהב איתמר</p>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
